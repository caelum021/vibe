<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vibe-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg:         #F4F3EF;
        --surface:    #FCFBF9;
        --surface-2:  #ECEAE4;
        --text:       #1A1916;
        --muted:      #7C7874;
        --accent:     #C85A2A;
        --accent-sub: #EED8CE;
        --border:     #D5D1CA;
        --success:    #3A7D52;
        --warning:    #B07A2A;
        --error:      #9B3030;
        --search-match:   rgba(200, 90, 42, 0.12);
        --search-current: rgba(200, 90, 42, 0.28);
      }
      [data-theme="dark"] {
        --bg:         #131312;
        --surface:    #1B1B19;
        --surface-2:  #22211E;
        --text:       #E9E6E0;
        --muted:      #757370;
        --accent:     #E8703A;
        --accent-sub: #2A1C12;
        --border:     #2C2A27;
        --success:    #4A9E68;
        --warning:    #C89040;
        --error:      #C04848;
        --search-match:   rgba(232, 112, 58, 0.15);
        --search-current: rgba(232, 112, 58, 0.32);
      }
      .vibe-logo {
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        color: var(--text);
        line-height: 1.1;
      }
      .vibe-logo-dot {
        font-style: normal;
        color: var(--accent);
      }
      @keyframes badge-pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.6; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Explorer header: reveal actions only on hover */
      .explorer-header .explorer-actions {
        opacity: 0;
        transform: translateX(4px);
        transition: opacity 180ms ease-out, transform 180ms ease-out;
        pointer-events: none;
      }
      .explorer-header:hover .explorer-actions {
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body, html, #root {
        margin: 0; padding: 0;
        height: 100%; width: 100%;
        background-color: var(--bg);
        color: var(--text);
        overflow: hidden;
        font-family: 'Geist', 'Inter', -apple-system, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      button, input { font-family: inherit; font-size: inherit; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
      ::selection { background: var(--accent-sub); color: var(--text); }
      mark[data-md-match] { background: var(--search-match); color: inherit; padding: 0; border-radius: 2px; }
      mark[data-md-match][data-current="true"] { background: var(--search-current); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
